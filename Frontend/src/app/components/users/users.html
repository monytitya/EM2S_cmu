<section class="users-page"><header class="page-heading"><div><p class="eyebrow">People directory</p><h1>Employee List</h1><p class="subtitle">Manage employee accounts and access levels</p></div><button class="primary-button" type="button">＋ Add new employee</button></header><div class="toolbar"><label class="search-box">⌕ <input placeholder="Search employees" /></label><select><option>All roles</option><option>HR Manager</option><option>Employee</option></select><select><option>All status</option><option>Active</option><option>Inactive</option></select></div><div class="table-panel"><div class="table-status"><span>All employees <b>1,470</b></span><button type="button" aria-label="Export employee list">↗ Export</button></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Employee ID</th><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody><tr *ngFor="let user of users$ | async"><td><span class="person"><span class="person-avatar">{{ user.username.slice(0, 2).toUpperCase() }}</span><b>{{ user.username }}</b></span></td><td>#{{ user.id }}</td><td>{{ user.email }}</td><td>{{ user.role }}</td><td><span [class]="user.isActive ? 'status active' : 'status inactive'">{{ user.isActive ? 'Active' : 'Inactive' }}</span></td><td><button class="row-action" type="button" aria-label="Open employee actions">•••</button></td></tr></tbody></table></div></div></section>

<section class="resource-page" *ngIf="config$ | async as config"><header class="page-heading"><div><p class="eyebrow">Workspace management</p><h1>{{ config.title }}</h1><p class="subtitle">{{ config.description }}</p></div><button class="primary-button" type="button">＋ Add {{ config.title | lowercase | slice:0:-1 }}</button></header><div class="toolbar"><label class="search-box">⌕ <input [(ngModel)]="query" placeholder="Search {{ config.title | lowercase }}" /></label><button class="filter-button" type="button">☷ Filters</button></div><div class="table-panel" *ngIf="state$ | async as state"><div class="table-status"><span>{{ config.title }} <b>{{ visible(state.records).length }}</b></span><span class="state-message" *ngIf="state.loading">Loading data...</span><span class="state-message error" *ngIf="state.error">Unable to load data from the API.</span></div><div class="empty" *ngIf="!state.loading && !state.error && !visible(state.records).length">No {{ config.title | lowercase }} found.</div><div class="table-wrap" *ngIf="state.records.length"><table><thead><tr><th *ngFor="let column of config.columns">{{ column.label }}</th><th>Action</th></tr></thead><tbody><tr *ngFor="let record of visible(state.records)"><td *ngFor="let column of config.columns">{{ display(record, column.key) }}</td><td><button class="row-action" type="button" aria-label="Open record actions">•••</button></td></tr></tbody></table></div></div></section>

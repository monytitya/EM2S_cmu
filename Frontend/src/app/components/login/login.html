<main class="login-page"><section class="login-card"><div class="brand"><span class="brand-mark">H</span><strong>HUMAN<span>IQ</span></strong></div><p class="eyebrow">Workforce intelligence</p><h1>Welcome back</h1><p class="subtitle">Sign in to manage your people operations.</p><form (ngSubmit)="submit()"><label>Username<input name="username" [(ngModel)]="username" autocomplete="username" placeholder="Enter username" /></label><label>Password<input name="password" [(ngModel)]="password" autocomplete="current-password" type="password" placeholder="Enter password" /></label><p class="error" *ngIf="error">{{ error }}</p><button type="submit" [disabled]="submitting">{{ submitting ? 'Signing in...' : 'Sign in' }}</button></form></section><aside class="login-art"><p>People data,<br /><strong>made useful.</strong></p><span>HR operations at a glance</span></aside></main>

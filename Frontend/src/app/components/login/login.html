<main class="login-page"><section class="login-card"><div class="brand"><span class="brand-mark">H</span><strong>HUMAN<span>IQ</span></strong></div><p class="eyebrow">Workforce intelligence</p><h1>{{ mode === 'login' ? 'Welcome back' : 'Create account' }}</h1><p class="subtitle">{{ mode === 'login' ? 'Sign in to manage your people operations.' : 'Register to access the HR workspace.' }}</p><form (ngSubmit)="submit()"><label>Username<input name="username" [(ngModel)]="username" autocomplete="username" placeholder="Enter username" /></label><label *ngIf="mode === 'register'">Email<input name="email" [(ngModel)]="email" autocomplete="email" type="email" placeholder="Enter email" /></label><label>Password<input name="password" [(ngModel)]="password" autocomplete="current-password" type="password" placeholder="Enter password" /></label><p class="error" *ngIf="error">{{ error }}</p><button type="submit" [disabled]="submitting">{{ submitting ? (mode === 'login' ? 'Signing in...' : 'Registering...') : (mode === 'login' ? 'Sign in' : 'Register') }}</button></form><p class="switch-link"><button type="button" (click)="toggleMode()">{{ mode === 'login' ? 'Need an account? Register' : 'Already have an account? Sign in' }}</button></p></section><aside class="login-art"><p>People data,<br /><strong>made useful.</strong></p><span>HR operations at a glance</span></aside></main>

services:
  auth-service:
    build: .
    depends_on:
      postgres-auth:
        condition: service_healthy
    ports:
      - "9090:9090"
    environment:
      SPRING_PROFILES_ACTIVE: auth-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/authdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.deploy}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a base64-encoded 32-byte key}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}

  employee-service:
    build: .
    depends_on:
      postgres-employee:
        condition: service_healthy
    ports:
      - "9091:9090"
    environment:
      SPRING_PROFILES_ACTIVE: employee-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-employee:5432/employeedb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.deploy}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a base64-encoded 32-byte key}

  leave-service:
    build: .
    depends_on:
      postgres-leave:
        condition: service_healthy
    ports:
      - "9092:9090"
    environment:
      SPRING_PROFILES_ACTIVE: leave-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-leave:5432/leavedb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.deploy}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a base64-encoded 32-byte key}

  payroll-service:
    build: .
    depends_on:
      postgres-payroll:
        condition: service_healthy
    ports:
      - "9093:9090"
    environment:
      SPRING_PROFILES_ACTIVE: payroll-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-payroll:5432/payrolldb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.deploy}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a base64-encoded 32-byte key}

  postgres-auth:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.deploy}
    ports:
      - "127.0.0.1:${AUTH_DB_HOST_PORT:-55432}:5432"
    volumes:
      - auth-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-employee:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: employeedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.deploy}
    ports:
      - "127.0.0.1:${EMPLOYEE_DB_HOST_PORT:-55433}:5432"
    volumes:
      - employee-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d employeedb"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-leave:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: leavedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.deploy}
    ports:
      - "127.0.0.1:${LEAVE_DB_HOST_PORT:-55434}:5432"
    volumes:
      - leave-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leavedb"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-payroll:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: payrolldb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.deploy}
    ports:
      - "127.0.0.1:${PAYROLL_DB_HOST_PORT:-55435}:5432"
    volumes:
      - payroll-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payrolldb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  auth-db:
  employee-db:
  leave-db:
  payroll-db:

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cmu-springboot-ingress
  labels:
    app: cmu-springboot
spec:
  ingressClassName: nginx
  rules:
    - host: cmu.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cmu-springboot
                port:
                  number: 9090

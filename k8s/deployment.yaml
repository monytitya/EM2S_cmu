apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: cmu-springboot:local
          imagePullPolicy: Never
          ports:
            - containerPort: 9090
              name: http
          envFrom:
            - configMapRef:
                name: cmu-springboot-microservices-config
            - secretRef:
                name: cmu-springboot-microservices-secret
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: auth-service
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-auth:5432/authdb
          startupProbe:
            httpGet:
              path: /swagger-ui.html
              port: http
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /swagger-ui.html
              port: http
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /swagger-ui.html
              port: http
            timeoutSeconds: 5
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - name: http
      port: 9090
      targetPort: http
---
